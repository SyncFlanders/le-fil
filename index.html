<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Fil</title>
<meta name="description" content="Mes nouvelles du jour, sur mes sujets.">
<meta name="theme-color" content="#f3efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#f3efe8; --encre:#16181d; --doux:#5d616b; --pale:#8c909a;
  --verre:rgba(255,255,255,.58); --verre-fort:rgba(255,255,255,.78);
  --bord:rgba(255,255,255,.75); --ombre:0 1px 0 rgba(255,255,255,.6) inset, 0 10px 30px -12px rgba(30,25,15,.28);
  --filet:rgba(22,24,29,.08);
  --teinte:#c4552d; --teinte-2:#e7a24a;
  --serif:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --sans:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:22px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --fond:#0f1115; --encre:#eef0f4; --doux:#a9adb8; --pale:#7b808c;
    --verre:rgba(32,35,43,.55); --verre-fort:rgba(38,41,50,.82);
    --bord:rgba(255,255,255,.09); --ombre:0 1px 0 rgba(255,255,255,.06) inset, 0 12px 32px -14px rgba(0,0,0,.7);
    --filet:rgba(255,255,255,.08);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--encre)}
body{font:16px/1.5 var(--sans);min-height:100dvh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* Fond vivant : deux halos de la teinte du thème actif, qui glissent d'une couleur à l'autre */
.halos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.halos i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;transition:background-color .9s ease}
.halos i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:var(--teinte)}
.halos i:nth-child(2){width:55vmax;height:55vmax;right:-25vmax;top:25vh;background:var(--teinte-2);opacity:.35}
@media (prefers-color-scheme: dark){.halos i{opacity:.28}.halos i:nth-child(2){opacity:.18}}

.page{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}

/* En-tête */
header{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  background:linear-gradient(to bottom,color-mix(in srgb,var(--fond) 70%,transparent),color-mix(in srgb,var(--fond) 25%,transparent));
  mask-image:linear-gradient(to bottom,#000 80%,transparent);-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent)}
.ligne-haut{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.marque{font:600 2.1rem/1 var(--serif);letter-spacing:-.025em;margin:0}
.marque em{font-style:normal;color:var(--teinte);transition:color .6s}
.date-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--verre);border:1px solid var(--bord);
  box-shadow:var(--ombre);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:.82rem;font-weight:600;white-space:nowrap}
.date-btn:active{transform:scale(.96)}
.etat{margin:6px 0 0;font-size:.78rem;color:var(--pale);letter-spacing:.01em}

/* Cartes en verre */
.verre{background:var(--verre);border:1px solid var(--bord);border-radius:var(--r);box-shadow:var(--ombre);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%)}
@media (prefers-reduced-transparency: reduce){.verre,.date-btn,nav.onglets{background:var(--verre-fort);backdrop-filter:none}}

h2.section{font:600 .74rem/1 var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--doux);margin:28px 4px 12px}

/* À la une */
.une{display:grid;gap:12px}
.une-carte{padding:20px 20px 18px;position:relative;overflow:hidden}
.une-carte .tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teinte)}
.une-carte h3{font:600 1.45rem/1.15 var(--serif);letter-spacing:-.015em;margin:6px 0 8px}
.une-carte p{margin:0;color:var(--doux);font-size:.95rem}
.une-carte:first-child h3{font-size:1.75rem}
.une-carte:active,.mini:active{transform:scale(.985);transition:transform .1s}

/* Résumé condensé de l'essentiel */
.mini{display:block;padding:14px 16px;margin-bottom:10px}
.mini b{display:block;font:600 1.05rem/1.25 var(--serif);margin-bottom:3px}
.mini span{font-size:.88rem;color:var(--doux);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Sujet */
.sujet{padding:20px;margin-bottom:14px}
.sujet h3{font:600 1.5rem/1.15 var(--serif);letter-spacing:-.015em;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.sujet h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teinte);flex:none}
.resume{margin:0 0 12px;font-size:1rem;line-height:1.6}
.points{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.points li{position:relative;padding-left:16px;font-size:.92rem;color:var(--doux)}
.points li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:2px;border-radius:2px;background:var(--teinte)}
.liens{display:grid;gap:0;margin:0 -8px}
.lien{display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-radius:12px;border-top:1px solid var(--filet)}
.lien:active{background:color-mix(in srgb,var(--teinte) 10%,transparent)}
.lien .t{font-size:.93rem;line-height:1.35;font-weight:500}
.lien .m{font-size:.76rem;color:var(--pale);display:flex;gap:6px;align-items:center}
.badge{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;
  background:color-mix(in srgb,var(--teinte) 16%,transparent);color:var(--teinte)}
.calme{color:var(--pale);font-style:italic;margin:0}

/* Dépêches brutes */
details.depeches{margin-top:10px}
details.depeches summary{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  font-size:.84rem;font-weight:600;color:var(--teinte);padding:8px 0}
details.depeches summary::-webkit-details-marker{display:none}
details.depeches summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .25s}
details[open].depeches summary::after{transform:rotate(-135deg)}
.filtres{display:flex;gap:6px;margin:4px 0 6px}
.puce{font-size:.76rem;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--filet);color:var(--doux)}
.puce[aria-pressed="true"]{background:var(--teinte);border-color:var(--teinte);color:#fff}

/* Barre d'onglets en verre, en bas, sous le pouce */
nav.onglets{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--verre);border:1px solid var(--bord);box-shadow:var(--ombre),0 18px 40px -18px rgba(0,0,0,.35);
  backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);width:max-content;max-width:calc(100vw - 24px)}
.onglet{position:relative;padding:10px 15px;border-radius:999px;font-size:.84rem;font-weight:600;color:var(--doux);white-space:nowrap;transition:color .25s}
.onglet[aria-selected="true"]{color:#fff}
.pastille{position:absolute;z-index:-1;top:6px;bottom:6px;left:0;border-radius:999px;background:var(--teinte);
  transition:transform .42s cubic-bezier(.3,1.3,.5,1),width .42s cubic-bezier(.3,1.3,.5,1),background-color .6s}
.onglet:active{transform:scale(.95)}

/* Feuille des éditions passées */
.voile{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .3s}
.voile.ouvert{opacity:1;pointer-events:auto}
.feuille{position:fixed;z-index:10;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;max-height:70dvh;overflow:auto;
  border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));background:var(--verre-fort);
  backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border:1px solid var(--bord);
  transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.25,1)}
.feuille.ouvert{transform:none}
.poignee{width:38px;height:5px;border-radius:5px;background:var(--pale);opacity:.5;margin:2px auto 14px}
.feuille h4{font:600 1.3rem var(--serif);margin:0 0 10px}
.edition{display:flex;justify-content:space-between;width:100%;padding:13px 4px;border-top:1px solid var(--filet);font-size:.95rem;text-align:left}
.edition[aria-current="true"]{color:var(--teinte);font-weight:700}

.vide{padding:28px 22px;text-align:center;color:var(--doux)}
.vide h3{font:600 1.4rem var(--serif);margin:0 0 6px;color:var(--encre)}

/* Apparition douce des cartes */
.apparait{animation:apparait .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes apparait{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .apparait{animation:fondu .2s both}@keyframes fondu{from{opacity:0}to{opacity:1}}
  .pastille,.feuille,.halos i{transition:none}
}
</style>
</head>
<body>
<div class="halos" aria-hidden="true"><i></i><i></i></div>
<div class="page">
  <header>
    <div class="ligne-haut">
      <h1 class="marque">Le Fil<em>.</em></h1>
      <button class="date-btn" id="btnEditions" aria-haspopup="dialog">
        <span id="dateEdition">…</span>
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="etat" id="etat">Chargement…</p>
  </header>
  <main id="contenu"></main>
</div>

<nav class="onglets" role="tablist" id="onglets"><span class="pastille" id="pastille"></span></nav>

<div class="voile" id="voile"></div>
<section class="feuille" id="feuille" role="dialog" aria-label="Éditions précédentes">
  <div class="poignee"></div>
  <h4>Éditions</h4>
  <div id="listeEditions"></div>
</section>

<script>
const TEINTES = {
  essentiel: ["#c4552d", "#e7a24a"],
  sport:     ["#2f7d5b", "#7cc29a"],
  tech:      ["#4a5bd4", "#8f7cf0"],
  luxe:      ["#a8744a", "#d9b48a"],
};
const ONGLETS = [["essentiel", "L'essentiel"], ["sport", "Sport"], ["tech", "IA & tech"], ["luxe", "Luxe"]];
const etat = { resume: null, depeches: null, editions: [], onglet: "essentiel", edition: null };
const $ = (s) => document.querySelector(s);
// Espaces insécables avant % : ; ! ? » pour éviter « 8,5 » en fin de ligne et « % » au début de la suivante
const typo = (t) => esc(t).replace(/ ([%:;!?»])/g, "\u202f$1").replace(/« /g, "«\u202f");
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function depuis(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return "à l'instant";
  if (min < 60) return `il y a ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `il y a ${h} h`;
  const j = Math.round(h / 24);
  return j === 1 ? "hier" : `il y a ${j} j`;
}
const jourLong = (d) => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const jourCourt = (d) => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });

async function charger(url) {
  const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function demarrer() {
  try {
    const [resume, depeches, editions] = await Promise.allSettled([
      charger("data/resume.json"), charger("data/depeches.json"), charger("data/archives/index.json"),
    ]);
    etat.resume = resume.value || null;
    etat.depeches = depeches.value || null;
    etat.editions = editions.value || [];
    etat.edition = etat.derniere = etat.resume?.date || null;
  } catch (e) { console.warn(e); }
  const depuisHash = location.hash.slice(1);
  if (TEINTES[depuisHash]) etat.onglet = depuisHash;
  construireOnglets();
  afficher();
}

function construireOnglets() {
  const nav = $("#onglets");
  ONGLETS.forEach(([id, nom]) => {
    const b = document.createElement("button");
    b.className = "onglet"; b.role = "tab"; b.dataset.id = id; b.textContent = nom;
    b.addEventListener("click", () => changerOnglet(id));
    nav.appendChild(b);
  });
}

function changerOnglet(id) {
  if (id === etat.onglet) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  etat.onglet = id;
  history.replaceState(null, "", "#" + id);
  window.scrollTo({ top: 0 });
  afficher();
}

function placerPastille() {
  const actif = document.querySelector(`.onglet[data-id="${etat.onglet}"]`);
  const p = $("#pastille");
  if (!actif) return;
  p.style.width = actif.offsetWidth + "px";
  p.style.transform = `translateX(${actif.offsetLeft}px)`;
}

function appliquerTeinte() {
  const [a, b] = TEINTES[etat.onglet];
  document.documentElement.style.setProperty("--teinte", a);
  document.documentElement.style.setProperty("--teinte-2", b);
}

function afficher() {
  appliquerTeinte();
  document.querySelectorAll(".onglet").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === etat.onglet));
  requestAnimationFrame(placerPastille);

  const r = etat.resume;
  $("#dateEdition").textContent = r ? jourCourt(r.date) : "—";
  const morceaux = [];
  if (r) morceaux.push(`Résumé du ${jourLong(r.date)}`);
  if (etat.depeches) morceaux.push(`dépêches ${depuis(etat.depeches.genere_le)}`);
  $("#etat").textContent = morceaux.join(" · ") || "Pas encore d'édition";

  const main = $("#contenu");
  if (!r) { main.innerHTML = `<div class="vide verre apparait"><h3>Pas encore d'édition</h3><p>Le premier résumé arrive demain matin.</p></div>`; return; }
  main.innerHTML = etat.onglet === "essentiel" ? vueEssentiel(r) : vueTheme(r, etat.onglet);
  main.querySelectorAll(".apparait").forEach((el, i) => (el.style.animationDelay = Math.min(i * 45, 400) + "ms"));
  brancherFiltres();
}

function themeDuSujet(r, idSujet) {
  return r.themes.find((t) => t.sujets.some((s) => s.id === idSujet));
}

function vueEssentiel(r) {
  let h = "";
  if (r.a_la_une?.length) {
    h += `<h2 class="section">À la une</h2><div class="une">`;
    h += r.a_la_une.map((u) => {
      const t = themeDuSujet(r, u.sujet);
      const s = t?.sujets.find((x) => x.id === u.sujet);
      return `<a class="une-carte verre apparait" href="#${t?.id || "essentiel"}" data-aller="${t?.id || ""}">
        <span class="tag">${esc(s?.titre || "")}</span><h3>${esc(u.titre)}</h3><p>${typo(u.texte)}</p></a>`;
    }).join("");
    h += `</div>`;
  }
  for (const t of r.themes) {
    h += `<h2 class="section">${esc(t.titre)}</h2>`;
    h += t.sujets.map((s) => `<a class="mini verre apparait" href="#${t.id}" data-aller="${t.id}" data-sujet="${s.id}">
      <b>${esc(s.titre)}</b><span>${typo(s.resume || "Rien de marquant aujourd'hui.")}</span></a>`).join("");
  }
  setTimeout(() => document.querySelectorAll("[data-aller]").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    const id = a.dataset.aller, sujet = a.dataset.sujet;
    if (!id) return;
    changerOnglet(id);
    if (sujet) requestAnimationFrame(() => document.getElementById("s-" + sujet)?.scrollIntoView({ behavior: "smooth", block: "start" }));
  })));
  return h;
}

function ligneArticle(a) {
  const passion = a.origine === "passionnes" ? `<span class="badge">spécialisé</span>` : "";
  return `<a class="lien" href="${esc(a.url)}" target="_blank" rel="noopener">
    <span class="t">${esc(a.titre)}</span>
    <span class="m">${passion}${esc(a.source)} · ${depuis(a.date)}</span></a>`;
}

function vueTheme(r, idTheme) {
  const t = r.themes.find((x) => x.id === idTheme);
  if (!t) return `<div class="vide verre"><h3>Aucun sujet</h3></div>`;
  const tDep = etat.depeches?.themes.find((x) => x.id === idTheme);
  return `<h2 class="section">${esc(t.titre)}</h2>` + t.sujets.map((s) => {
    const dep = tDep?.sujets.find((x) => x.id === s.id)?.articles || [];
    const points = (s.points || []).map((p) => `<li>${typo(p)}</li>`).join("");
    const liens = (s.articles || []).map(ligneArticle).join("");
    return `<article class="sujet verre apparait" id="s-${s.id}" style="scroll-margin-top:110px">
      <h3>${esc(s.titre)}</h3>
      ${s.resume ? `<p class="resume">${typo(s.resume)}</p>` : `<p class="calme">Rien de marquant aujourd'hui.</p>`}
      ${points ? `<ul class="points">${points}</ul>` : ""}
      ${liens ? `<div class="liens">${liens}</div>` : ""}
      ${dep.length ? `<details class="depeches" data-sujet="${s.id}">
        <summary>Toutes les dépêches (${dep.length})</summary>
        <div class="filtres">
          <button class="puce" data-f="tout" aria-pressed="true">Tout</button>
          <button class="puce" data-f="passionnes" aria-pressed="false">Spécialisés</button>
          <button class="puce" data-f="presse" aria-pressed="false">Presse</button>
        </div>
        <div class="liens">${dep.map((a) => ligneArticle(a).replace('<a class="lien"', `<a class="lien" data-o="${a.origine}"`)).join("")}</div>
      </details>` : ""}
    </article>`;
  }).join("");
}

function brancherFiltres() {
  document.querySelectorAll("details.depeches").forEach((d) => {
    d.querySelectorAll(".puce").forEach((b) => b.addEventListener("click", () => {
      d.querySelectorAll(".puce").forEach((x) => x.setAttribute("aria-pressed", x === b));
      d.querySelectorAll(".lien[data-o]").forEach((l) => (l.hidden = b.dataset.f !== "tout" && l.dataset.o !== b.dataset.f));
    }));
  });
}

/* Éditions précédentes */
function ouvrirFeuille(ouvrir) {
  $("#feuille").classList.toggle("ouvert", ouvrir);
  $("#voile").classList.toggle("ouvert", ouvrir);
}
$("#btnEditions").addEventListener("click", () => {
  $("#listeEditions").innerHTML = etat.editions.length
    ? etat.editions.map((d) => `<button class="edition" data-d="${d}" aria-current="${d === etat.edition}"><span>${jourLong(d)}</span><span>›</span></button>`).join("")
    : `<p class="calme">Aucune édition pour l'instant.</p>`;
  $("#listeEditions").querySelectorAll(".edition").forEach((b) => b.addEventListener("click", async () => {
    try {
      etat.resume = await charger(`data/archives/${b.dataset.d}.json`);
      etat.edition = b.dataset.d;
      ouvrirFeuille(false); afficher();
    } catch { b.textContent = "Édition indisponible hors ligne"; }
  }));
  ouvrirFeuille(true);
});
$("#voile").addEventListener("click", () => ouvrirFeuille(false));

/* Recharge quand on revient sur l'appli */
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible") return;
  try {
    const [r, d] = await Promise.all([charger("data/resume.json"), charger("data/depeches.json")]);
    const surLaDerniere = etat.edition === etat.derniere;
    const change = d.genere_le !== etat.depeches?.genere_le || (surLaDerniere && r.genere_le !== etat.resume?.genere_le);
    if (surLaDerniere) { etat.resume = r; etat.edition = etat.derniere = r.date; }
    etat.depeches = d;
    if (r.date && !etat.editions.includes(r.date)) etat.editions.unshift(r.date);
    if (change) afficher();
  } catch {}
});
window.addEventListener("resize", placerPastille);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
demarrer();
</script>
</body>
</html>
